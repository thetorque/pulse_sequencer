<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="Helvetica, Arial, sans-serif">
  <title>USB-PD 5 V power card block diagram</title>
  <desc>Build option A: USB-C with CH224A PD trigger. Build option B: 20-24 V DC through an AOD4185 reverse-polarity MOSFET. Only one is fitted. The input feeds a TPS16630 eFuse (3 A / 5 A switch-selected limit), then an LM5145 buck converter outputs 5 V at up to 18 A to the DIN 41612 backplane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t  { font-size: 14px; font-weight: 600; text-anchor: middle; }
      .s  { font-size: 12px; text-anchor: middle; }
      .l  { font-size: 12px; fill: #444441; }
      .teal rect   { fill: #E1F5EE; stroke: #0F6E56; }
      .teal .t     { fill: #085041; } .teal .s { fill: #0F6E56; }
      .purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .purple .t   { fill: #3C3489; } .purple .s { fill: #534AB7; }
      .gray rect   { fill: #F1EFE8; stroke: #5F5E5A; }
      .gray .t     { fill: #444441; } .gray .s { fill: #5F5E5A; }
      .arr  { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
      .ctl  { stroke: #7F77DD; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    </style>
  </defs>
  <rect width="680" height="400" fill="#FFFFFF"/>

  <g class="purple"><rect x="40" y="40" width="125" height="50" rx="4"/><text class="t" x="102" y="60">PD trigger</text><text class="s" x="102" y="77">CH224A, 20 V</text></g>
  <g class="gray"><rect x="40" y="120" width="125" height="56" rx="4"/><text class="t" x="102" y="142">USB-C input</text><text class="s" x="102" y="160">option A, 20 V</text></g>
  <g class="gray"><rect x="40" y="230" width="125" height="56" rx="4"/><text class="t" x="102" y="252">DC input</text><text class="s" x="102" y="270">option B, 20–24 V</text></g>
  <g class="teal"><rect x="190" y="230" width="120" height="56" rx="4"/><text class="t" x="250" y="252">Polarity guard</text><text class="s" x="250" y="270">AOD4185 (Q3)</text></g>
  <g class="teal"><rect x="335" y="175" width="150" height="56" rx="4"/><text class="t" x="410" y="197">Input protection</text><text class="s" x="410" y="215">TPS16630 eFuse (U2)</text></g>
  <g class="purple"><rect x="335" y="290" width="150" height="50" rx="4"/><text class="t" x="410" y="310">3 A / 5 A switch</text><text class="s" x="410" y="327">SW1, front panel</text></g>
  <g class="teal"><rect x="505" y="175" width="135" height="56" rx="4"/><text class="t" x="572" y="197">Buck converter</text><text class="s" x="572" y="215">LM5145, 400 kHz</text></g>
  <g class="gray"><rect x="505" y="290" width="135" height="56" rx="4"/><text class="t" x="572" y="312">5 V, 18 A out</text><text class="s" x="572" y="330">to DIN 41612</text></g>

  <line x1="102" y1="90" x2="102" y2="120" class="ctl"/>
  <line x1="165" y1="258" x2="188" y2="258" class="arr" marker-end="url(#arrow)"/>
  <path d="M165 148 H322 V258 H310" class="arr"/>
  <line x1="322" y1="203" x2="333" y2="203" class="arr" marker-end="url(#arrow)"/>
  <line x1="485" y1="203" x2="503" y2="203" class="arr" marker-end="url(#arrow)"/>
  <line x1="410" y1="290" x2="410" y2="233" class="ctl" marker-end="url(#arrow)"/>
  <line x1="572" y1="231" x2="572" y2="288" class="arr" marker-end="url(#arrow)"/>

  <g class="teal"><rect x="40" y="368" width="14" height="14" rx="3"/></g><text class="l" x="62" y="379">Power path</text>
  <g class="purple"><rect x="160" y="368" width="14" height="14" rx="3"/></g><text class="l" x="182" y="379">Control / setting</text>
  <g class="gray"><rect x="310" y="368" width="14" height="14" rx="3"/></g><text class="l" x="332" y="379">Connectors (fit J1 or J2, not both)</text>
</svg>
